name: build-kit

# Reusable workflow: builds one kit or kit set for linux/amd64 and linux/arm64,
# publishes it as ghcr.io/<owner>/<repo>/<name>, and validates it with kit-tck.
# Called by publish-kits.yaml, once per kit and once per kit set.
#
#   pull request          nothing pushed: built to a local OCI layout and
#                         checked with kit-tck (a kit set waits for its
#                         members: skipped while one isn't published yet)
#   push of a v* tag      :<version from the descriptor> and :latest, unless
#                         that version is already published (then skipped)
#   manual run on main    :edge and :sha-<short> (elsewhere: build only)
#
# With `set: true`, the descriptor is a kit set whose members include this
# repository's kits, listed at the release version. A release builds it as
# written; other runs point those members at what exists: the :edge the same
# run just pushed on main, or the last release (:latest) otherwise, since a
# bumped version isn't published yet.

on:
  workflow_call:
    inputs:
      name:
        description: Package name, published as ghcr.io/<owner>/<repo>/<name>
        required: true
        type: string
      context:
        description: Build context
        required: true
        type: string
      descriptor:
        description: Path to the kit descriptor (the -f of docker buildx build)
        required: true
        type: string
      set:
        description: The descriptor is a kit set listing this repository's kits
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # kit-tck, the Sandbox Kit specification's conformance checker. Pinned to a
  # release, installed by the spec's setup-tck action (pinned to that release's
  # commit), which checks the release's checksums.txt and the archive's SHA256
  # below. To move to a new release, update all three together: this version,
  # KIT_TCK_SHA256 (the kit-tck_<version>_linux_amd64.tar.gz line of its
  # checksums.txt) and the setup-tck commit.
  KIT_TCK_VERSION: 3.0.0-m.14
  KIT_TCK_SHA256: cc246acdf0343f83a4f80d54fadf889f13e193c4b907d0c6c5a84aec7a46ebd8

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>/<repo>/*
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Decide what this run does and what to call the result.
      - name: Resolve image name and tags
        id: meta
        env:
          NAME: ${{ inputs.name }}
          DESCRIPTOR: ${{ inputs.descriptor }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          # The descriptor is the version authority (top-level `version:` only;
          # args are indented).
          version="$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"[:space:]#]*\).*/\1/p' "$DESCRIPTOR" | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error file=$DESCRIPTOR::no top-level version: found"
            exit 1
          fi

          image="${REGISTRY}/${GITHUB_REPOSITORY,,}/${NAME}"

          # members: the tag a kit set uses for this repository's kits.
          publish=false
          members=latest
          tags="${image}:ci-build"
          primary="${image}:ci-build"
          if [ "$EVENT" != "pull_request" ]; then
            if [[ "$REF" == refs/tags/v* ]]; then
              publish=true
              members="$version"
              tags="${image}:${version},${image}:latest"
              primary="${image}:${version}"
            elif [ "$REF" = "refs/heads/main" ]; then
              publish=true
              members=edge
              tags="${image}:edge,${image}:sha-${GITHUB_SHA::7}"
              primary="${image}:edge"
            fi
          fi

          {
            echo "version=$version"
            echo "members=$members"
            echo "publish=$publish"
            echo "tags=$tags"
            echo "primary=$primary"
          } >> "$GITHUB_OUTPUT"

      - name: Point the set's members at the kits this run uses
        if: inputs.set && steps.meta.outputs.members != steps.meta.outputs.version
        env:
          DESCRIPTOR: ${{ inputs.descriptor }}
          VERSION: ${{ steps.meta.outputs.version }}
          MEMBERS: ${{ steps.meta.outputs.members }}
        run: |
          set -euo pipefail
          # Only this repository's kits: ghcr.io/<owner>/<repo>/<kit>:<version>.
          prefix="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          sed -i "s#\(${prefix}/[a-z-]*\):${VERSION}\$#\1:${MEMBERS}#" "$DESCRIPTOR"
          grep -n 'ref:' "$DESCRIPTOR"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      # The default docker-container driver is what a Kit needs: it keeps the
      # manifest annotations that carry the descriptor.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two reasons not to build:
      # - a release whose version is already published (versions are immutable);
      # - outside a release, a kit set whose member from this repository isn't
      #   published at that tag yet, as happens to a kit's first release under a
      #   new name: the set builds once the release publishes it.
      - name: Skip what is already published, or can't be built yet
        id: exists
        env:
          PUBLISH: ${{ steps.meta.outputs.publish }}
          PRIMARY: ${{ steps.meta.outputs.primary }}
          SET: ${{ inputs.set }}
          DESCRIPTOR: ${{ inputs.descriptor }}
          MEMBERS: ${{ steps.meta.outputs.members }}
          VERSION: ${{ steps.meta.outputs.version }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          skip=false
          reason=""
          if [ "$PUBLISH" = "true" ] && [[ "$REF" == refs/tags/v* ]]; then
            if docker buildx imagetools inspect "$PRIMARY" > /dev/null 2>&1; then
              skip=true
              reason="Skipped: this version is already published."
              echo "::notice::$PRIMARY already exists; not republishing. Bump version: in the descriptor to release a new one."
            fi
          elif [ "$SET" = "true" ] && [ "$MEMBERS" != "$VERSION" ]; then
            prefix="${REGISTRY}/${GITHUB_REPOSITORY,,}/"
            for ref in $(sed -n 's/^[[:space:]]*- ref:[[:space:]]*\([^[:space:]#]*\).*/\1/p' "$DESCRIPTOR" | grep "^${prefix}" || true); do
              if ! docker buildx imagetools inspect "$ref" > /dev/null 2>&1; then
                skip=true
                reason="Skipped: member \`$ref\` isn't published yet; the set builds once a release publishes it."
                echo "::notice::$ref isn't published yet, so this set can't be built on this run. It builds on the release that publishes it."
              fi
            done
          fi
          {
            echo "skip=$skip"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

      # The `# syntax=docker/sandbox-kit:3` line of the descriptor makes BuildKit
      # run the Kit frontend, which validates the descriptor and attaches it to
      # the image; for a kit set it resolves the members, pins each by digest
      # and merges them. mode=min is what the spec asks for with multi-platform
      # builds (the descriptor ends up on every platform manifest and the index).
      - name: Build${{ steps.meta.outputs.publish == 'true' && ' and push' || '' }}
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.descriptor }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=min
          sbom: false
          push: ${{ steps.meta.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          # When nothing is pushed, export the kit as an OCI layout (a directory)
          # so kit-tck can judge exactly what would have been published. The
          # layout names the image by its tag, ci-build.
          outputs: ${{ steps.meta.outputs.publish != 'true' && format('type=oci,dest={0}/kit-layout,tar=false', runner.temp) || '' }}

      # kit-tck is the spec's conformance checker. On a pull request it reads the
      # OCI layout above; after a publish it reads the registry, because the
      # frontend's own checks cannot see metadata an exporter or a registry drops.
      - name: Install kit-tck
        if: steps.exists.outputs.skip != 'true'
        uses: docker/sandbox-kit-spec/actions/setup-tck@7c8b7cd53acc7271184b5c66ab0acb9613df56c7 # v3.0.0-m.14
        with:
          version: ${{ env.KIT_TCK_VERSION }}
          sha256: ${{ env.KIT_TCK_SHA256 }}

      - name: Validate with kit-tck
        if: steps.exists.outputs.skip != 'true'
        env:
          PUBLISH: ${{ steps.meta.outputs.publish }}
          PRIMARY: ${{ steps.meta.outputs.primary }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            kit-tck validate "$PRIMARY"
          else
            kit-tck validate --layout "$RUNNER_TEMP/kit-layout" ci-build
          fi

      - name: Summary
        if: always()
        env:
          PUBLISH: ${{ steps.meta.outputs.publish }}
          SKIP: ${{ steps.exists.outputs.skip }}
          REASON: ${{ steps.exists.outputs.reason }}
          TAGS: ${{ steps.meta.outputs.tags }}
          NAME: ${{ inputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          SET: ${{ inputs.set }}
          MEMBERS: ${{ steps.meta.outputs.members }}
        run: |
          {
            echo "### ${NAME} ${VERSION}"
            if [ "$SET" = "true" ]; then
              echo "Kit set; this repository's kits at \`:${MEMBERS}\`."
              echo
            fi
            if [ "$SKIP" = "true" ]; then
              echo "$REASON"
            elif [ "$PUBLISH" != "true" ]; then
              echo "Built and checked with kit-tck from an OCI layout (nothing pushed)."
            else
              echo "Published:"
              echo
              echo "$TAGS" | tr ',' '\n' | while read -r tag; do
                echo "- \`$tag\`"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
