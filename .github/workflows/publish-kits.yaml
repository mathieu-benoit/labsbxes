name: publish-kits

# Builds the kits and publishes them to this repository's container registry
# (GHCR), as ghcr.io/<owner>/<repo>/<kit>. Each kit and kit set is built by
# build-kit.yaml (a reusable workflow); this file decides what is built, in
# which order, and checks the versions first.
#
#   labspace             kit/                            the Labspace runtime (a mixin for the `shell` agent)
#   hello-lab-mixin      examples/hello-lab/             a lab's content, as a kit
#   building-images-lab-mixin examples/building-images-lab/ a lab's content, as a kit
#
# and, once those are built, a kit set per lab that merges the `shell` workload,
# the Labspace kit and the lab's content kit into one reference:
#
#   hello-lab                examples/hello-lab/set/
#   building-images-lab      examples/building-images-lab/set/
#
# What gets pushed, by event:
#
#   pull request          nothing: all kits are built to a local OCI layout and
#                         checked with kit-tck, so a broken kit fails the PR
#   push of a v* tag      :<version from the kit's descriptor> and :latest
#   manual run on main    :edge and :sha-<short> (elsewhere: build only)
#
# Commits to main do not publish anything on their own.
#
# The kits are versioned in lockstep: all descriptors carry the same
# `version:`, and a release tag must name it (v0.1.1 releases 0.1.1). The
# `versions` job fails the run otherwise, before anything is built. The kit
# sets carry that version too, and list their members at it.
#
# A release (v* tag) never overwrites a version that already exists: a kit whose
# version is already published is skipped, so a published version always means
# the same content.

on:
  pull_request:
    paths:
      - "kit/**"
      - "examples/hello-lab/**"
      - "examples/building-images-lab/**"
      - ".github/workflows/publish-kits.yaml"
      - ".github/workflows/build-kit.yaml"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Two runs on the same ref must not race to move a tag.
concurrency:
  group: publish-kits-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versions:
    name: versions in lockstep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check all kits share one version, and the tag names it
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          # Same top-level `version:` extraction as build-kit.yaml.
          read_version() {
            sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"[:space:]#]*\).*/\1/p' "$1" | head -n 1
          }
          labspace="$(read_version kit/labspace.yaml)"
          hello_lab="$(read_version examples/hello-lab/hello-lab.yaml)"
          building_images_lab="$(read_version examples/building-images-lab/building-images-lab.yaml)"
          echo "labspace:        ${labspace:-<none>}"
          echo "hello-lab:       ${hello_lab:-<none>}"
          echo "building-images-lab: ${building_images_lab:-<none>}"

          if [ -z "$labspace" ] || [ "$labspace" != "$hello_lab" ] || [ "$labspace" != "$building_images_lab" ]; then
            echo "::error::The kits must share one version: kit/labspace.yaml says '${labspace}', examples/hello-lab/hello-lab.yaml says '${hello_lab}', examples/building-images-lab/building-images-lab.yaml says '${building_images_lab}'."
            exit 1
          fi

          # The kit sets: same version, and every member from this repository
          # listed at it (build-kit.yaml retags them on non-release runs).
          for set in examples/hello-lab/set/hello-lab-set.yaml examples/building-images-lab/set/building-images-lab-set.yaml; do
            set_version="$(read_version "$set")"
            echo "$(basename "$set" .yaml): ${set_version:-<none>}"
            if [ "$set_version" != "$labspace" ]; then
              echo "::error file=$set::version is '${set_version}', the kits are '${labspace}'."
              exit 1
            fi
            stale="$(grep '^[[:space:]]*- ref:' "$set" | grep -o 'ghcr\.io/mathieu-benoit/labsbxes/[a-z-]*:[^[:space:]]*' | grep -v ":${labspace}\$" || true)"
            if [ -n "$stale" ]; then
              echo "::error file=$set::members must be listed at ${labspace}: ${stale}"
              exit 1
            fi
          done

          if [[ "$REF" == refs/tags/v* ]]; then
            tag_version="${REF#refs/tags/v}"
            if [ "$tag_version" != "$labspace" ]; then
              echo "::error::Release tag v${tag_version} does not match the kits' version ${labspace}. Tag v${labspace}, or bump version: in every descriptor."
              exit 1
            fi
          fi

          echo "OK: all kits are ${labspace}."

  kits:
    name: ${{ matrix.name }}
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: labspace
            context: kit
            descriptor: kit/labspace.yaml
          - name: hello-lab-mixin
            context: examples/hello-lab
            descriptor: examples/hello-lab/hello-lab.yaml
          - name: building-images-lab-mixin
            context: examples/building-images-lab
            descriptor: examples/building-images-lab/building-images-lab.yaml
    uses: ./.github/workflows/build-kit.yaml
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>/<repo>/*
    with:
      name: ${{ matrix.name }}
      context: ${{ matrix.context }}
      descriptor: ${{ matrix.descriptor }}

  # A kit set lists published kits, so it builds after them: on a release, the
  # set pins the versions the kits job just published.
  sets:
    name: ${{ matrix.name }}
    needs: kits
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hello-lab
            context: examples/hello-lab/set
            descriptor: examples/hello-lab/set/hello-lab-set.yaml
          - name: building-images-lab
            context: examples/building-images-lab/set
            descriptor: examples/building-images-lab/set/building-images-lab-set.yaml
    uses: ./.github/workflows/build-kit.yaml
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>/<repo>/*
    with:
      name: ${{ matrix.name }}
      context: ${{ matrix.context }}
      descriptor: ${{ matrix.descriptor }}
      set: true
