# syntax=docker/sandbox-kit:3
#
# The content of a lab as a kit. It carries the lab's two folders and nothing
# else; everything that runs them comes from the Labspace kit (../../kit).
#
#   sbx run shell --kit <labspace kit> --kit <this kit>
schemaVersion: "3"
kind: mixin

displayName: Hello Labspace (content)
description: >-
  The "Hello Labspace on Docker Sandboxes" lab: instructions and starter project,
  to be run by the Labspace kit.

version: "0.1.13"

# Becomes the org.opencontainers.image.source annotation, which is what links
# the published GHCR package to this repository.
sourceUrl: https://github.com/mathieu-benoit/labsbxes

# The Labspace kit provides `labspace`. Composing this kit without it fails at
# resolution instead of producing a sandbox with files and nothing to show them.
requires: ["labspace >= 0.1.0"]

# One lab per sandbox: a second content kit provides the same name, and the
# runtime refuses the composition.
provides: ["labspace-content@0.1.13"]

capabilities:
  # The lab's "Docker inside the sandbox" page runs nginx on port 3000 and
  # opens it in a tab. The lab declares that port itself rather than relying on
  # the Labspace kit's appPort default: it is still published if appPort is
  # changed, and the two entries are one publication when they match.
  # sbx picks the host port (sbx port ls <name>); -p 3000:3000 pins it for the tab.
  - type: com.docker.sandbox/port@1
    config:
      container: 3000
